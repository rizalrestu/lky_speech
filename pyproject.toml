[project]
name = "nas-speech"
version = "0.1.0"
description = "RAG chatbot over Lee Kuan Yew's speeches from the National Archives of Singapore"
readme = "README.md"
requires-python = ">=3.10"
# single source of truth for dependencies — uv.lock pins the exact resolution.
# torch is floored at 2.6: earlier versions default to the pickle-RCE-prone
# weights_only=False when loading model checkpoints.
dependencies = [
    "scrapy==2.13.4",
    "streamlit>=1.60.0",
    "transformers>=5.14.1",
    "sentencepiece>=0.2.2",
    "sentence-transformers>=5.6.1",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "torch>=2.6",
]
