services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    # not published to the host: web_app reaches it over the compose network
    expose:
      - "6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  web_app:
    build: .
    container_name: lky_chatbot
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      # host.docker.internal lets the container talk to Ollama on the host
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
    depends_on:
      - qdrant
    restart: always

volumes:
  qdrant_storage:
